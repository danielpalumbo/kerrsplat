name: CI

# One run per pull request: the merge commit of a PR is the commit its run tested, so a second run
# on the push to main would repeat it (the repository is public since 2026-09-10, so minutes are
# free on standard runners, but a run is about an hour of Enzyme compilation).
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: CPU gates (Julia 1.10)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JULIA_NUM_THREADS: 4
      JULIA_PKG_USE_CLI_GIT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - uses: julia-actions/cache@v2
      - name: Instantiate
        run: julia --project=. -e 'import Pkg; Pkg.instantiate()'
      - name: CPU gates
        run: julia --project=. test/ci.jl
